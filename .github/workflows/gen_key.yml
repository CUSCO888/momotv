name: Generate JKS
on: workflow_dispatch # 手动触发
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Key
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
          -alias my-key-alias -storepass my_password -keypass my_password \
          -dname "CN=hayate, OU=TV, O=TV, L=SH, S=SH, C=CN"
          
          echo "Your Base64 String is below:"
          base64 -w 0 release.jks
